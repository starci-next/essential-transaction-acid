# The shoe shop: one NestJS api (shop) and one Postgres database. `migrate` applies db/migrations and loads the sample data
# once, then exits; the shop starts only after it succeeded. TEST_HOOKS=on opens the fault switches the end-to-end specs
# use; leave it off in production.
name: essential-transaction-acid-typescript

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "${PG_PORT:-5476}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
    image: essential-transaction-acid-typescript:local
    command: ["sh", "-c", "node dist/apps/cli/main.js migrate && node dist/apps/cli/main.js seed"]
    environment:
      DATABASE_URL: postgres://shop:shop@postgres:5432/shop
    depends_on:
      postgres:
        condition: service_healthy

  shop:
    image: essential-transaction-acid-typescript:local
    command: ["node", "dist/apps/shop/main.js"]
    # restart: always brings the process back after CRASH_AT kills it.
    restart: always
    ports:
      - "${SHOP_PORT:-4310}:4310"
    environment:
      PORT: "4310"
      DATABASE_URL: postgres://shop:shop@postgres:5432/shop
      TEST_HOOKS: "on"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4310/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
